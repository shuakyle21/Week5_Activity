[project]
name = "the-polite-scraper"
version = "1.0.0"
description = "A small, fault-tolerant web scraping pipeline with Pydantic-validated JSON output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.scripts]
polite-scraper = "polite_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polite_scraper"]
